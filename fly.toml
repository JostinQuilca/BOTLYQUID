app = 'damian-portilla'
primary_region = 'iad'
swap_size_mb = 512

[build]

[mounts]
  source = 'bot_data'
  destination = '/app/data/db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
